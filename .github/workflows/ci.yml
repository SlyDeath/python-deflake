name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # id-token: write lets Codecov take the coverage without a token
    permissions:
      contents: read
      id-token: write
    name: Python ${{ matrix.python }} / pytest ${{ matrix.pytest }} / Django ${{ matrix.django }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pytest: ["8", "9"]
        django: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0 and newer need Python 3.12 or newer
          - python: "3.11"
            django: "6.0"
          - python: "3.11"
            django: "6.1"
        include:
          # The oldest pytest deflake supports
          - python: "3.11"
            pytest: "8.0"
            django: "5.2"
            os: ubuntu-latest
          # Coverage is measured once, on the newest stable Python
          - python: "3.14"
            pytest: "9"
            django: "6.1"
            os: ubuntu-latest
            coverage: true
          # macOS signals processes through its own API
          - python: "3.11"
            pytest: "9"
            django: "5.2"
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv pip install "pytest==${{ matrix.pytest }}.*" "django==${{ matrix.django }}.*"
      - run: uv run --no-sync pytest ${{ matrix.coverage && '--cov --cov-report=xml' || '' }}
      - if: matrix.coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          # A pull request from a fork gets no OIDC token, and Codecov takes it without one
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          # Codecov being down does not hold back a release
          fail_ci_if_error: ${{ !startsWith(github.ref, 'refs/tags/') }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync mypy
