[project]
name = "deflake-py"
version = "0.1.0"
description = "Find flaky tests in pytest, unittest and Django and explain why they fail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Roman Belyaev", email = "slyrs@yandex.ru" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["flaky", "tests", "pytest", "unittest", "django", "test pollution", "bisect"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
django = ["Django>=5.2"]

[project.scripts]
deflake = "deflake.cli:main"

[project.urls]
Homepage = "https://github.com/SlyDeath/python-deflake"
Source = "https://github.com/SlyDeath/python-deflake"
Changelog = "https://github.com/SlyDeath/python-deflake/blob/main/CHANGELOG.md"
Issues = "https://github.com/SlyDeath/python-deflake/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
    "django>=5.2.19",
    "pytest-randomly>=5.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=16.7",
    "freezegun>=1.5.5",
    "time-machine>=3.6.0",
    "pytest-django>=4.14.0",
    "faker>=40.52.0",
    "pydantic>=2.14.3",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deflake"]

[tool.hatch.build.targets.sdist]
include = ["src/deflake", "README.md", "CHANGELOG.md", "LICENSE.txt", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = ["e2e: runs the deflake command on a fixture project"]
addopts = "-n auto"

[tool.coverage.run]
source = ["deflake"]
branch = true
# Most of deflake runs in the test processes it starts
patch = ["subprocess"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4", "PIE", "RET"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

# Django has no types of its own, and django-stubs needs the settings of a project
[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["deflake.django.*"]
disallow_subclassing_any = false
warn_return_any = false
